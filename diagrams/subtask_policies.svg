<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="522px" preserveAspectRatio="none" style="width:1134px;height:522px;background:#FFFFFF;" version="1.1" viewBox="0 0 1134 522" width="1134px" zoomAndPan="magnify"><defs/><g><!--cluster store--><g class="cluster" data-entity="store" data-source-line="15" data-uid="ent0002" id="cluster_store"><rect fill="#FFFFFF" height="272" rx="4" ry="4" style="stroke:#616974;stroke-width:1;" width="257" x="361.5" y="7"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="122.5605" x="369.3467" y="20.1387">AppData::m_tasks</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="110.3906" x="500.2627" y="20.1387">(one flat vector)</text></g><!--entity parent--><g class="entity" data-entity="parent" data-source-line="16" data-uid="ent0003" id="entity_parent"><rect fill="#E8F0EC" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="137.0234" x="421" y="39"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="36.8613" x="431" y="60.1387">Lab 4</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="117.0234" x="431" y="74.1074">(parent &#183; due Aug 8</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="110.6484" x="431" y="88.0762">estimate 120 min)</text></g><!--entity piece--><g class="entity" data-entity="piece" data-source-line="17" data-uid="ent0004" id="entity_piece"><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="129.7402" x="420.5" y="201"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="97.0957" x="430.5" y="222.1387">Marc's section</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="109.7402" x="430.5" y="236.1074">(piece &#183; due Aug 4</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="103.0137" x="430.5" y="250.0762">estimate 25 min)</text></g><!--entity workload--><g class="entity" data-entity="workload" data-source-line="21" data-uid="ent0007" id="entity_workload"><rect fill="#E8F0EC" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="208.5723" x="7" y="365"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="188.5723" x="17" y="386.1387">upcomingTasks() / tasksIn()</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="171.6738" x="17" y="400.1074">&#171; workload &#8212; parents only &#187;</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="78.2285" x="17" y="414.0762">shows: Lab 4</text></g><!--entity dueon--><g class="entity" data-entity="dueon" data-source-line="22" data-uid="ent0008" id="entity_dueon"><rect fill="#E8F0EC" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="171.7695" x="450.5" y="365"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="131.4023" x="460.5" y="386.1387">tasksDueOn(Aug 4)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="151.7695" x="460.5" y="400.1074">&#171; that day's obligations &#187;</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="130.9453" x="460.5" y="414.0762">shows: Marc's section</text></g><!--entity guard--><g class="entity" data-entity="guard" data-source-line="23" data-uid="ent0009" id="entity_guard"><rect fill="#FDF3F2" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="157.707" x="657.5" y="365"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="137.707" x="667.5" y="386.1387">taskCountIn(School)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="133.4648" x="667.5" y="400.1074">&#171; the deletion guard &#187;</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="133.5469" x="667.5" y="414.0762">counts: 2 (everything)</text></g><!--entity chip--><g class="entity" data-entity="chip" data-source-line="24" data-uid="ent0010" id="entity_chip"><rect fill="#E8F0EC" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="163.8125" x="251.5" y="365"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="143.8125" x="261.5" y="386.1387">pieceProgress(Lab 4)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="125.4141" x="261.5" y="400.1074">&#171; the card's &#9745; chip &#187;</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="84.3926" x="261.5" y="414.0762">answers: 0 / 1</text></g><!--entity rollup--><g class="entity" data-entity="rollup" data-source-line="33" data-uid="ent0017" id="entity_rollup"><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="338.5625" x="790" y="201"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="138.0234" x="800" y="222.1387">what never happens</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="318.5625" x="800" y="236.1074">ticking every piece does NOT complete the parent &#8212;</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="240.4219" x="800" y="250.0762">the tick is the reward, in both directions</text></g><!--reverse link parent to piece--><g class="link" data-entity-1="parent" data-entity-2="piece" data-source-line="19" data-uid="lnk6" id="link_parent_piece"><path d="M488.5986,107.0881 C487.8786,135.6081 486.97,172.21 486.26,200.77" fill="none" id="parent-backto-piece" style="stroke:#616974;stroke-width:1;"/><polygon fill="#616974" points="488.75,101.09,484.5241,109.9862,488.6238,106.0884,492.5216,110.1881,488.75,101.09" style="stroke:#616974;stroke-width:1;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="46.5244" x="506.1816" y="142.2104">parentId</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="57.9111" x="500.4883" y="155.0151">(one level,</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="81.8877" x="488.5" y="167.8198">door-enforced)</text></g><!--link parent to workload--><g class="link" data-entity-1="parent" data-entity-2="workload" data-source-line="26" data-uid="lnk11" id="link_parent_workload"><path d="M449.48,101.32 C394.68,143.3 293.83,222.19 212.5,295 C187.31,317.55 164.3515,340.3069 144.5515,360.5869" fill="none" id="parent-to-workload" style="stroke:#616974;stroke-width:1;"/><polygon fill="#616974" points="140.36,364.88,149.5094,361.2346,143.8529,361.3024,143.7852,355.6459,140.36,364.88" style="stroke:#616974;stroke-width:1;"/></g><!--link piece to workload--><g class="link" data-entity-1="piece" data-entity-2="workload" data-source-line="27" data-uid="lnk12" id="link_piece_workload"><path d="M420.44,251.57 C384.02,262.71 338.1,278 298.5,295 C250.8,315.48 204.1226,340.7512 167.1326,362.0012" fill="none" id="piece-to-workload" style="stroke:#C25B54;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#C25B54" points="161.93,364.99,171.7264,363.9752,166.2655,362.4993,167.7414,357.0384,161.93,364.99" style="stroke:#C25B54;stroke-width:1;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="60.8491" x="310.3335" y="306.2104">filtered out</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="82.5161" x="299.5" y="319.0151">(double-counts</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="62.1382" x="309.689" y="331.8198">the parent)</text></g><!--link piece to dueon--><g class="link" data-entity-1="piece" data-entity-2="dueon" data-source-line="28" data-uid="lnk13" id="link_piece_dueon"><path d="M478.66,263.04 C475.32,283.91 473.68,312.01 482.5,335 C486.67,345.86 489.8267,351.493 497.5767,360.223" fill="none" id="piece-to-dueon" style="stroke:#616974;stroke-width:1;"/><polygon fill="#616974" points="501.56,364.71,498.5764,355.3239,498.2406,360.9708,492.5937,360.635,501.56,364.71" style="stroke:#616974;stroke-width:1;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="79.3203" x="495.9314" y="312.7104">dated &#8594; a real</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="104.1831" x="483.5" y="325.5151">obligation that day</text></g><!--link parent to guard--><g class="link" data-entity-1="parent" data-entity-2="guard" data-source-line="29" data-uid="lnk14" id="link_parent_guard"><path d="M539.4,101.01 C552.68,109.94 566.62,120.24 578.5,131 C648.69,194.56 672.93,209.92 714.5,295 C725.27,317.04 730.0003,338.4363 732.8303,358.9563" fill="none" id="parent-to-guard" style="stroke:#616974;stroke-width:1;"/><polygon fill="#616974" points="733.65,364.9,736.3829,355.4379,732.9669,359.9469,728.4579,356.5309,733.65,364.9" style="stroke:#616974;stroke-width:1;"/></g><!--link piece to guard--><g class="link" data-entity-1="piece" data-entity-2="guard" data-source-line="30" data-uid="lnk15" id="link_piece_guard"><path d="M545.14,263.16 C561.19,272.43 578.08,283.3 592.5,295 