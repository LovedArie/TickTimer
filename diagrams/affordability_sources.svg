<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="494px" preserveAspectRatio="none" style="width:986px;height:494px;background:#FFFFFF;" version="1.1" viewBox="0 0 986 494" width="986px" zoomAndPan="magnify"><defs/><g><!--entity q--><g class="entity" data-entity="q" data-source-line="8" data-uid="ent0002" id="entity_q"><rect fill="#E8F0EC" height="47.9375" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="183.5645" x="561" y="7"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="123.8027" x="571" y="28.1387">affordability(task)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="163.5645" x="571" y="42.1074">&#171; how much is still to do? &#187;</text></g><!--entity est--><g class="entity" data-entity="est" data-source-line="10" data-uid="ent0003" id="entity_est"><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="168.9102" x="568.5" y="116"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="110.7598" x="578.5" y="137.1387">estimate exists?</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="148.9102" x="578.5" y="151.1074">(own &#8212; or the SUM of its</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="109.418" x="578.5" y="165.0762">pieces' estimates)</text></g><!--entity epath--><g class="entity" data-entity="epath" data-source-line="12" data-uid="ent0004" id="entity_epath"><rect fill="#E8F0EC" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="244.5664" x="278.5" y="293"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="107.5898" x="288.5" y="314.1387">ESTIMATE PATH</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="43.1836" x="399.9043" y="314.1387">(v28.4)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="85.6113" x="288.5" y="328.1074">outstanding =</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="66.6738" x="288.5" y="342.0762">estimate &#215;</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="90.8555" x="358.9883" y="342.0762">personal rate</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="59.4082" x="453.6582" y="342.0762">&#8722; tracked</text></g><!--entity ppath--><g class="entity" data-entity="ppath" data-source-line="13" data-uid="ent0005" id="entity_ppath"><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="187.9473" x="559" y="293"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="86.666" x="569" y="314.1387">PROXY PATH</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="77.4668" x="659.4805" y="314.1387">(v28.0, kept)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="85.6113" x="569" y="328.1074">outstanding =</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="153.6445" x="569" y="342.0762">blocks planned &#8722; tracked</text></g><!--entity unknown--><g class="entity" data-entity="unknown" data-source-line="14" data-uid="ent0006" id="entity_unknown"><rect fill="#FDF3F2" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="198.2891" x="782" y="293"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="72.6094" x="792" y="314.1387">UNKNOWN</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="178.2891" x="792" y="328.1074">no estimate AND no blocks &#8212;</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="167.1621" x="792" y="342.0762">&#171; I can't tell &#187;, said out loud</text></g><!--entity mult--><g class="entity" data-entity="mult" data-source-line="16" data-uid="ent0007" id="entity_mult"><rect fill="#E8F0EC" height="117.7813" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="191.6152" x="7" y="265"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="135.0762" x="17" y="286.1387">personalMultiplier()</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="171.6152" x="17" y="300.1074">median of actual &#247; estimate</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="134.9121" x="17" y="314.0762">over finished, tracked,</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="95.748" x="17" y="328.0449">estimated tasks</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="131.9121" x="17" y="342.0137">(1.0 under 3 samples;</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="101.9473" x="17" y="355.9824">clamped 0.5-3.0;</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="134.1328" x="17" y="369.9512">derived, never stored)</text></g><!--link q to est--><g class="link" data-entity-1="q" data-entity-2="est" data-source-line="18" data-uid="lnk8" id="link_q_est"><path d="M653,55.07 C653,72.51 653,90.6 653,109.61" fill="none" id="q-to-est" style="stroke:#616974;stroke-width:1;"/><polygon fill="#616974" points="653,115.61,657,106.61,653,110.61,649,106.61,653,115.61" style="stroke:#616974;stroke-width:1;"/></g><!--link est to epath--><g class="link" data-entity-1="est" data-entity-2="epath" data-source-line="19" data-uid="lnk9" id="link_est_epath"><path d="M609.68,178.08 C563.52,210.14 495.7885,257.178 449.5285,289.298" fill="none" id="est-to-epath" style="stroke:#616974;stroke-width:1;"/><polygon fill="#616974" points="444.6,292.72,454.274,290.8726,448.7071,289.8683,449.7114,284.3013,444.6,292.72" style="stroke:#616974;stroke-width:1;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="566" y="225.7104">yes</text></g><!--link est to ppath--><g class="link" data-entity-1="est" data-entity-2="ppath" data-source-line="20" data-uid="lnk10" id="link_est_ppath"><path d="M653,178.08 C653,210.14 653,254.6 653,286.72" fill="none" id="est-to-ppath" style="stroke:#616974;stroke-width:1;"/><polygon fill="#616974" points="653,292.72,657,283.72,653,287.72,649,283.72,653,292.72" style="stroke:#616974;stroke-width:1;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="77.376" x="654" y="219.2104">no, but blocks</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="75.0234" x="655.1763" y="232.0151">were planned</text></g><!--link est to unknown--><g class="link" data-entity-1="est" data-entity-2="unknown" data-source-line="21" data-uid="lnk11" id="link_est_unknown"><path d="M698.2,178.15 C711.79,187.5 726.65,197.98 740,208 C776.88,235.69 812.97,265.3358 841.11,289.0258" fill="none" id="est-to-unknown" style="stroke:#616974;stroke-width:1;"/><polygon fill="#616974" points="845.7,292.89,841.3911,284.0337,841.875,289.6699,836.2389,290.1538,845.7,292.89" style="stroke:#616974;stroke-width:1;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="72.3271" x="773" y="219.2104">no, and none</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="55.1182" x="781.6045" y="232.0151">ever were</text></g><!--link mult to epath--><g class="link" data-entity-1="mult" data-entity-2="epath" data-source-line="22" data-uid="lnk12" id="link_mult_epath"><path d="M199.34,324 C224.51,324 245.98,324 272.31,324" fill="none" id="mult-to-epath" style="stroke:#616974;stroke-width:1;"/><polygon fill="#616974" points="278.31,324,269.31,320,273.31,324,269.31,328,278.31,324" style="stroke:#616974;stroke-width:1;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="43.8926" x="217.25" y="318.2104">the rate</text></g><g class="legend" data-source-line="24"><rect fill="none" height="75.1875" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="551.8848" x="210.2021" y="399.7813"/><text fill="#2A2E33" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="357.417" x="215.2021" y="417.7764">One verdict pipeline, two sizing sources: the user's</text><text fill="#2A2E33" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="69.542" x="577.0693" y="417.7764">estimate</text><text fill="#2A2E33" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="72.0439" x="651.0615" y="417.7764">(scaled by</text><text fill="#2A2E33" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="382.9697" x="215.2021" y="434.0732">their own measured rate) outranks the planned-blocks</text><text fill="#2A2E33" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="44.7002" x="602.6221" y="434.0732">proxy</text><text fill="#2A2E33" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="103.3525" x="647.3223" y="434.0732">; Unknown has</text><text fill="#2A2E33" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="541.8848" x="215.2021" y="450.3701">shrunk to the case where