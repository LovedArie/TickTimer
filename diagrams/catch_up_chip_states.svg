<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="573px" preserveAspectRatio="none" style="width:891px;height:573px;background:#FFFFFF;" version="1.1" viewBox="0 0 891 573" width="891px" zoomAndPan="magnify"><title>The catch-up chip &#8212; three intensities, one always-open door</title><defs/><g><text fill="#2A2E33" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="479.0762" x="198.9719" y="22.9951">The catch-up chip &#8212; three intensities, one always-open door</text><g id="absent"><rect fill="#FFFFFF" height="50" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="100.8418" x="674.52" y="238.2969"/><line style="stroke:#616974;stroke-width:0.5;" x1="674.52" x2="775.3618" y1="276.2344" y2="276.2344"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="47.9473" x="700.9673" y="254.4355">ABSENT</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="80.8418" x="684.52" y="268.4043">(card hidden)</text></g><g id="prom"><rect fill="#FFFFFF" height="50" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="165.6523" x="386.02" y="375.2969"/><line style="stroke:#616974;stroke-width:0.5;" x1="386.02" x2="551.6723" y1="413.2344" y2="413.2344"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="71.7773" x="432.9575" y="391.4355">PROMINENT</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="145.6523" x="396.02" y="405.4043">amber &#183; &#171;N to catch up&#187;</text></g><g id="muted"><rect fill="#FFFFFF" height="50" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="160.4668" x="379.02" y="72.2969"/><line style="stroke:#616974;stroke-width:0.5;" x1="379.02" x2="539.4868" y1="110.2344" y2="110.2344"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="43.2891" x="437.6089" y="88.4355">MUTED</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="140.4668" x="389.02" y="102.4043">gray &#183; &#171;N &#183; back 22:30&#187;</text></g><ellipse cx="875.02" cy="97.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN14"><path d="M574.02,47.2969 L574.02,93.2969 L539.23,97.2969 L574.02,101.2969 L574.02,147.0781 A4,4 0 0 0 578.02,151.0781 L825.7759,151.0781 A4,4 0 0 0 829.7759,147.0781 L829.7759,53.2969 L819.7759,43.2969 L578.02,43.2969 A4,4 0 0 0 574.02,47.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><path d="M819.7759,43.2969 L819.7759,51.2969 A2,2 0 0 0 821.7759,53.2969 L829.7759,53.2969 L819.7759,43.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="210.252" x="580.02" y="59.4355">Clicking the MUTED chip opens the</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="234.7559" x="580.02" y="73.4043">drawer but does NOT clear the snooze:</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="198.8906" x="580.02" y="87.373">the midday review is transient &#8212;</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="225.5859" x="580.02" y="101.3418">prominence returns only at the reset.</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="208.2246" x="580.02" y="115.3105">(Owner's workflow: quiet workday,</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="210.873" x="580.02" y="129.2793">deliberate re-summon, guaranteed</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="97.5059" x="580.02" y="143.248">evening return.)</text></g><g id="elem_GMN17"><path d="M333.52,490.2969 L333.52,562.1406 A4,4 0 0 0 337.52,566.1406 L600.6274,566.1406 A4,4 0 0 0 604.6274,562.1406 L604.6274,496.2969 L594.6274,486.2969 L473.02,486.2969 L469.02,425.4969 L465.02,486.2969 L337.52,486.2969 A4,4 0 0 0 333.52,490.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><path d="M594.6274,486.2969 L594.6274,494.2969 A2,2 0 0 0 596.6274,496.2969 L604.6274,496.2969 L594.6274,486.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="214.6641" x="339.52" y="502.4355">The drawer is reachable from every</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="190.9453" x="339.52" y="516.4043">visible state. It holds ALL verbs:</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="177.0059" x="339.52" y="530.373">Move &#8594; , Done, Skip, Skip all,</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="213.5332" x="339.52" y="544.3418">the undo receipt, bring-back, Later.</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="250.1074" x="339.52" y="558.3105">The glance panel reads; the drawer does.</text></g><!--link *start* to absent--><g id="link_*start*_absent"><path d="M875.55,107.4569 C876.23,127.9769 875.05,178.1669 850.02,208.2969 C831.37,230.7569 807.3625,242.3679 781.5725,250.1779 " fill="none" id="*start*-to-absent" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="775.83,251.9169,785.603,253.1367,780.6154,250.4677,783.2844,245.4801,775.83,251.9169" style="stroke:#616974;stroke-width:1.0;"/></g><!--link absent to prom--><g id="link_absent_prom"><path d="M719.4,288.3469 C713.9,306.5969 703.7,330.9169 686.02,345.2969 C648.46,375.8669 601.9165,388.6571 557.9765,394.5671 " fill="none" id="absent-to-prom" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="552.03,395.3669,561.4829,398.1315,556.9854,394.7004,560.4165,390.2029,552.03,395.3669" style="stroke:#616974;stroke-width:1.0;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="101.1377" x="734.3384" y="329.5073">a block ends short</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="153.7744" x="708.02" y="342.312">(at a moment, not snoozed)</text></g><!--link prom to absent--><g id="link_prom_absent"><path d="M478.35,375.2369 C486.63,356.9769 500.47,332.6569 520.02,318.2969 C544.35,300.4369 615.7465,284.4225 668.1565,274.4125 " fill="none" id="prom-to-absent" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="674.05,273.2869,664.4594,271.0463,669.1388,274.2249,665.9602,278.9043,674.05,273.2869" style="stroke:#616974;stroke-width:1.0;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="103.0874" x="547.768" y="329.5073">last block resolved</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="156.5835" x="521.02" y="342.312">and recovery window empty</text></g><!--link absent to muted--><g id="link_absent_muted"><path d="M674.47,253.2369 C623.01,243.2369 547.54,226.1669 524.02,208.2969 C495.24,186.4169 478.904,153.4107 469.274,128.2407 " fill="none" id="absent-to-muted" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="467.13,122.6369,466.6101,132.472,468.9167,127.3068,474.0819,129.6133,467.13,122.6369" style="stroke:#616974;stroke-width:1.0;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="115.355" x="553.4734" y="192.5073">resolved blocks exist</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="172.2617" x="525.02" y="205.312">(&#171;N resolved&#187; &#8212; the way back)</text></g><!--link muted to absent--><g id="link_muted_absent"><path d="M496.95,122.4469 C514.38,132.6369 535.66,143.8369 556.02,151.2969 C618.22,174.0969 653.48,136.2169 702.02,181.2969 C717.56,195.7169 722.3143,213.8127 724.0043,231.9827 " fill="none" id="muted-to-absent" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="724.56,237.9569,727.7093,228.6251,724.0969,232.9784,719.7437,229.366,724.56,237.9569" style="stroke:#616974;stroke-width:1.0;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="92.0229" x="723.6562" y="192.5073">horizon ages the</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="99.2954" x="720.02" y="205.312">last block out (&#167;C)</text></g><!--link prom to muted--><g id="link_prom_muted"><path d="M402.04,375.2869 C363.56,357.6369 318.53,329.4769 296.02,288.2969 C259.24,220.9869 345.424,159.1069 405.754,125.3469 " fill="none" id="prom-to-muted" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="410.99,122.4169,401.1827,123.3212,406.6267,124.8585,405.0894,130.3025,410.99,122.4169" style="stroke:#616974;stroke-width:1.0;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="41.9321" x="340.2036" y="261.0073">&#171;Later&#187;</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="128.2993" x="297.02" y="273.812">(snooze until the reset)</text></g><!--link prom to muted--><g id="link_prom_muted"><path d="M468.22,375.0569 C466.34,318.5869 461.899,184.7736 460.029,128.4136 " fill="none" id="prom-to-muted-1" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="459.83,122.4169,456.1307,131.5446,459.9958,127.4141,464.1263,131.2793,459.83,122.4169" style="stroke:#616974;stroke-width:1.0;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="102.5127" x="475.5574" y="261.0073">moment toggle off</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="119.5874" x="467.02" y="273.812">(Settings &#8594; Catch-up)</text></g><!--link muted to prom--><g id="link_muted_prom"><path d="M378.96,108.0869 C246.96,127.5369 6,178.9669 88.02,288.2969 C123.74,335.8969 278.8235,368.7994 379.7735,385.8194 " fill="none" id="muted-to-prom" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="385.69,386.8169,377.4803,381.3763,380.7596,385.9856,376.1502,389.2649,385.69,386.8169" style="stroke:#616974;stroke-width:1.0;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="49.6504" x="159.3088" y="261.0073">the reset</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="190.228" x="89.02" y="273.812">(evening moment / snooze lapses)</text></g><!--SRC=[hLJ1Rjj64BtpAwQ-s2ea9d3H55200AxZWr5RAc8NFSI1iIH7qaBBNNPtAKKvvPGF2F8FEVW3Ul1Ddz8loPib9GlfDJvOeZZpPkQzDtDCen_tbnrJgMAvk6-R-tAXc_iGLUH0_ttyGglJ5_blT9BUZzg6jb__o7yTvDanacuNJ8tJDfARKPG7NSRMyvXunNv3qIiRTDJE4e8SNVzrU_6QT20lxuCk3DFCkrgW_fvIfJsN4jrL5i0si3yE55L39nqQspYaO9txm1HQlz8h3WDoNiA10s2hxHmL0aSwKMrqjOgwtESOrGJ9a0hALZIPKfgMZ2kN8HMjl5gpnuXqLfOSGefJCQAqZA8yAdEZl6IfznnUahDcSn2nKA433GBo8uNwITlIj1KJ9DeOpfksDbaMTGIJeiPU9f6nPz4p2_sSfE0mHBVeswpL9enSmvOgvtoMTImSdVr-Sp6vlRDGt5Uqq5N5Td14c4WL0VFjulvyCxs-dAHGLHViQVilRHyc19bJ4zGssyUKruZ2VLPom9sTUxNP9U2ZKEMIJa_7lpplK-esSfLbRtz-1_PUxIfdtMVwIK1fJ8eAqOtOLg1yuNn4vohYzzhLoIhMnLxwQd08a4e00KPnPeMlHMS0Vg-3W4XhktVRnxqXmLfgTv1bgOL3gEt35ORqsqUazsvhOGYJ4fCX1_zFwle4RVCvD7Ip6P9lE4QO66lmwJETzv8EiYxbOFezBd9snk_nddtdzuDsUnB6U1LYpzzkKeW9hsCDNLhWjRQLMnFNJTmSbDyZW73zGLPYpcbrxkm1fcknWDklvwWD4T2fdY_IfUZK9JetkbnApp97TnkIRSMK2GuntIvI0QpAeSXaUakbOPNslPznZ3Xvgc5Mo8FZedajPsP_CKG-10a5sh8jXJOSAbJfD_U9oXnn9zErJNTdxVnoPjnwJF-q6lT4db5YA8snqR2zkDhpABHrxUoGvYtE0dOjpVTqYwHMFiZWKl4ZzuGKBk8w2IDfHIXjS3zmEfAgNAZTZUnEAe9MkZkSQQDokenGmS3zPrT