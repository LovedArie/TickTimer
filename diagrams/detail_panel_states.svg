@startuml detail_panel_states

skinparam backgroundColor            #FFFFFF
skinparam defaultFontName            "Segoe UI"
skinparam defaultFontSize            12
skinparam defaultFontColor           #2A2E33
skinparam shadowing                  false
skinparam roundCorner                8

skinparam ArrowColor                 #616974
skinparam ArrowFontColor             #616974
skinparam ArrowFontSize              11

skinparam rectangle {
  BackgroundColor                    #FFFFFF
  BorderColor                        #616974
  FontColor                          #2A2E33
}
skinparam database {
  BackgroundColor                    #EDF4F1
  BorderColor                        #2F7E6E
}
skinparam component {
  BackgroundColor                    #FFFFFF
  BorderColor                        #616974
}
skinparam note {
  BackgroundColor                    #FDF6EC
  BorderColor                        #C9A45C
  FontColor                          #5A4A2A
}
skinparam class {
  BackgroundColor                    #FFFFFF
  BorderColor                        #616974
  HeaderBackgroundColor              #EDF4F1
}
skinparam sequence {
  ParticipantBackgroundColor         #FFFFFF
  ParticipantBorderColor             #616974
  LifeLineBorderColor                #A9B0B8
  GroupBackgroundColor               #EDF4F1
}
skinparam state {
  BackgroundColor                    #FFFFFF
  BorderColor                        #616974
}
skinparam activity {
  BackgroundColor                    #FFFFFF
  BorderColor                        #616974
  DiamondBackgroundColor             #EDF4F1
  DiamondBorderColor                 #2F7E6E
}
skinparam title {
  FontSize                           14
  FontColor                          #2A2E33
}


[*] - -> Closed
Closed - -> Clean : openTask(id)\n(slide in, fresh form, markClean)

Clean - -> Dirty : any edit\n(Save button lights)
Dirty - -> Clean : Save clicked\n(apply, reseed, "Saved ✓")

Clean - -> Clean : navigate / switch task\n(swap in place, no question)
Clean - -> Closed : ✕, Esc, or\nclick outside (scrim)

Dirty - -> Prompt : navigate, switch,\n✕, Esc, or click outside
Prompt - -> Clean : Save\n(apply, then proceed)
Prompt - -> Clean : Discard\n(proceed, nothing written)
Prompt - -> Dirty : Stay\n(the click did nothing)

note right of Prompt
  Save / Discard / Stay.
  Save is the DEFAULT button:
  Enter never destroys work.
end note

note right of Clean
  changed() while clean:
  reseed to the new truth.
  While dirty: the user's
  edits win; Save writes last.
end note

@enduml

