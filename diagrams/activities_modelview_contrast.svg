<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="468px" preserveAspectRatio="none" style="width:1161px;height:468px;background:#FFFFFF;" version="1.1" viewBox="0 0 1161 468" width="1161px" zoomAndPan="magnify"><title>Two model/view pipelines, deliberately unalike</title><defs/><g><text fill="#2A2E33" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="371.5127" x="388.1021" y="22.9951">Two model/view pipelines, deliberately unalike</text><!--cluster Upcoming page (v20 / v20.1)--><g id="cluster_Upcoming page (v20 / v20.1)"><path d="M594,43.2969 L786.8711,43.2969 A6,6 0 0 1 790.8711,47.2969 L797.8711,63.2656 L844,63.2656 A4,4 0 0 1 848,67.2656 L848,457.2969 A4,4 0 0 1 844,461.2969 L594,461.2969 A4,4 0 0 1 590,457.2969 L590,47.2969 A4,4 0 0 1 594,43.2969 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="590" x2="797.8711" y1="63.2656" y2="63.2656"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="194.8711" x="594" y="56.4355">Upcoming page (v20 / v20.1)</text></g><!--cluster Activities detail pane (v20.2)--><g id="cluster_Activities detail pane (v20.2)"><path d="M10,207.2969 L204.4063,207.2969 A6,6 0 0 1 208.4063,211.2969 L215.4063,227.2656 L300,227.2656 A4,4 0 0 1 304,231.2656 L304,457.2969 A4,4 0 0 1 300,461.2969 L10,461.2969 A4,4 0 0 1 6,457.2969 L6,211.2969 A4,4 0 0 1 10,207.2969 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="6" x2="215.4063" y1="227.2656" y2="227.2656"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="196.4063" x="10" y="220.4355">Activities detail pane (v20.2)</text></g><!--entity um--><g id="elem_um"><rect fill="#FFFFFF" height="71.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="224.7051" x="606.5" y="75.2969"/><rect fill="#FFFFFF" height="10" style="stroke:#616974;stroke-width:0.5;" width="15" x="811.2051" y="80.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="809.2051" y="82.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="809.2051" y="86.2969"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="84.8906" x="621.5" y="106.4355">TaskListModel</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="184.7051" x="621.5" y="120.4043">FIXED query: upcomingTasks()</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="140.6895" x="621.5" y="134.373">granular diff on change</text></g><!--entity up--><g id="elem_up"><rect fill="#FFFFFF" height="57.9375" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="210.4141" x="614" y="246.2969"/><rect fill="#FFFFFF" height="10" style="stroke:#616974;stroke-width:0.5;" width="15" x="804.4141" y="251.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="802.4141" y="253.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="802.4141" y="257.2969"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="92.1914" x="629" y="277.4355">TaskFilterProxy</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="170.4141" x="629" y="291.4043">priority lens + due-date sort</text></g><!--entity uv--><g id="elem_uv"><rect fill="#FFFFFF" height="57.9375" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="210.3672" x="614" y="387.2969"/><rect fill="#FFFFFF" height="10" style="stroke:#616974;stroke-width:0.5;" width="15" x="804.3672" y="392.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="802.3672" y="394.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="802.3672" y="398.2969"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="59.1621" x="629" y="418.4355">QListView</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="170.3672" x="629" y="432.4043">+ TaskCardDelegate (cards)</text></g><!--entity am--><g id="elem_am"><rect fill="#FFFFFF" height="71.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="265.2227" x="22.5" y="239.2969"/><rect fill="#FFFFFF" height="10" style="stroke:#616974;stroke-width:0.5;" width="15" x="267.7227" y="244.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="265.7227" y="246.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="265.7227" y="250.2969"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="118.7285" x="37.5" y="270.4355">CategoryTaskModel</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="225.2227" x="37.5" y="284.4043">PARAMETERISED: tasksIn(categoryId)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="148.0957" x="37.5" y="298.373">re-pointable &#183; plain reset</text></g><!--entity av--><g id="elem_av"><rect fill="#FFFFFF" height="57.9375" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="255.918" x="27" y="387.2969"/><rect fill="#FFFFFF" height="10" style="stroke:#616974;stroke-width:0.5;" width="15" x="262.918" y="392.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="260.918" y="394.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="260.918" y="398.2969"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="59.1621" x="42" y="418.4355">QListView</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="215.918" x="42" y="432.4043">+ CategoryTaskDelegate (flat rows)</text></g><!--entity rail--><g id="elem_rail"><rect fill="#FFFFFF" height="43.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="89.582" x="110" y="89.2969"/><rect fill="#FFFFFF" height="10" style="stroke:#616974;stroke-width:0.5;" width="15" x="179.582" y="94.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="177.582" y="96.2969"/><rect fill="#FFFFFF" height="2" style="stroke:#616974;stroke-width:0.5;" width="4" x="177.582" y="100.2969"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="49.582" x="125" y="120.4355">rail click</text></g><g id="elem_GMN14"><path d="M320.5,380.2969 L320.5,452.1406 A4,4 0 0 0 324.5,456.1406 L569.8535,456.1406 A4,4 0 0 0 573.8535,452.1406 L573.8535,386.2969 L563.8535,376.2969 L368.84,376.2969 L228.68,311.3769 L360.84,376.2969 L324.5,376.2969 A4,4 0 0 0 320.5,380.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><path d="M563.8535,376.2969 L563.8535,384.2969 A2,2 0 0 0 565.8535,386.2969 L573.8535,386.2969 L563.8535,376.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="185.1211" x="326.5" y="392.4355">No proxy here, on purpose.</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="219.9434" x="326.5" y="406.4043">No lens to apply, and insertion order</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="232.3535" x="326.5" y="420.373">is the order the user typed things in &#8212;</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="215.6016" x="326.5" y="434.3418">sorting it would destroy information</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="103.2832" x="326.5" y="448.3105">the user created.</text></g><g id="elem_GMN17"><path d="M863.5,239.2969 L863.5,311.1406 A4,4 0 0 0 867.5,315.1406 L1150.7168,315.1406 A4,4 0 0 0 1154.7168,311.1406 L1154.7168,245.2969 L1144.7168,235.2969 L943.08,235.2969 L781.93,147.4469 L935.08,235.2969 L867.5,235.2969 A4,4 0 0 0 863.5,239.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><path d="M1144.7168,235.2969 L1144.7168,243.2969 A2,2 0 0 0 1146.7168,245.2969 L1154.7168,245.2969 L1144.7168,235.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="253.3242" x="869.5" y="251.4355">A proxy exists here because the SAME set</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="255.6914" x="869.5" y="265.4043">of tasks must be viewable through several</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="270.2168" x="869.5" y="279.373">lenses without the model knowing about any</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="232.4297" x="869.5" y="293.3418">of them. Sorting/filtering is the proxy's</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="207.8438" x="869.5" y="307.3105">job; supplying rows is the model's.</text></g><!--link um to up--><g id="link_um_up"><path d="M719,147.4469 C719,177.0369 719,212.8069 719,240.2069 " fill="none" id="um-to-up" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="719,246.2069,723,237.2069,719,241.2069,715,237.2069,719,246.2069" style="stroke:#616974;stroke-width:1.0;"/></g><!--link up to uv--><g id="link_up_uv"><path d="M719,304.4269 C719,328.5369 719,357.1069 719,381.2069 " 