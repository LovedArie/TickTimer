 UI" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="9.5859" x="514.8579" y="394.9902">is</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="19.6934" x="528.2583" y="394.9902">the</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="196.4473" x="365.2095" y="408.959">debounce &#8212; no counter, no flag.</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="206.6387" x="132.5708" y="373.8516"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="186.6387" x="142.5708" y="394.9902">restart a 1s single-shot QTimer</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="144.3594" x="163.7104" y="436.7891"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="124.3594" x="173.7104" y="457.9277">1s of silence elapses</text><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="237.084" x="117.3481" y="490.7578"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="162.9609" x="127.3481" y="511.8965">prefs::setSidebarVisible(...)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="217.084" x="127.3481" y="525.8652">(belt-and-braces: already written on</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="162.334" x="127.3481" y="539.834">every Ctrl+B / toggle click)</text><polygon fill="#EDF4F1" points="175.6294,572.6641,296.1509,572.6641,308.1509,584.6641,296.1509,596.6641,175.6294,596.6641,163.6294,584.6641,175.6294,572.6641" style="stroke:#2F7E6E;stroke-width:0.5;"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="120.5215" x="175.6294" y="588.8184">is