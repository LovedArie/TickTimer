<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A505A"/>
    </marker>
    <marker id="arrsoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9098"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#FFFFFF; stroke:#4A505A; stroke-width:1.4; rx:10; }
    .store { fill:#FFF7E6; stroke:#B8860B; stroke-width:1.4; }
    .pure  { fill:#EAF5F1; stroke:#2F7E6E; stroke-width:1.6; }
    .group { fill:#F7F8F6; stroke:#C9CFC6; stroke-width:1; stroke-dasharray:5 4; }
    .t     { font-size:13px; fill:#2A2F36; }
    .b     { font-size:13px; font-weight:700; fill:#2A2F36; }
    .s     { font-size:11px; fill:#616974; font-style:italic; }
    .lbl   { font-size:11px; fill:#4A505A; }
    .soft  { stroke:#8A9098; stroke-width:1.3; stroke-dasharray:5 4; fill:none; }
    .hard  { stroke:#4A505A; stroke-width:1.5; fill:none; }
  </style>

  <text x="20" y="28" class="b" font-size="16">Settings &amp; the visible window — how a preference travels (v19.3)</text>
  <text x="20" y="46" class="s">solid = told (push) · dashed = read/derive (pull) · AppData / data.json never appear: a preference cannot dirty the planner or sync</text>

  <!-- glass group -->
  <rect x="20" y="66" width="470" height="120" class="group" rx="12"/>
  <text x="34" y="86" class="s">the glass</text>
  <rect x="40" y="96" width="190" height="72" class="box" rx="10"/>
  <text x="135" y="120" class="b" text-anchor="middle">SettingsDialog</text>
  <text x="135" y="138" class="s" text-anchor="middle">⚙ combos — end list rebuilt</text>
  <text x="135" y="153" class="s" text-anchor="middle">from start; writes on OK only</text>

  <rect x="280" y="96" width="190" height="72" class="box" rx="10"/>
  <text x="375" y="120" class="b" text-anchor="middle">MainWindow</text>
  <text x="375" y="138" class="s" text-anchor="middle">opens dialog; on accept →</text>
  <text x="375" y="153" class="s" text-anchor="middle">planner.applyDisplayPrefs()</text>

  <path class="hard" d="M280,132 H230" marker-end="url(#arr)"/>
  <text x="238" y="126" class="lbl">exec()</text>

  <!-- QSettings store -->
  <rect x="600" y="86" width="330" height="92" class="store" rx="16"/>
  <text x="765" y="110" class="b" text-anchor="middle">QSettings</text>
  <text x="765" y="128" class="t" text-anchor="middle">agenda/startMinutes · endMinutes · week/firstDay</text>
  <text x="765" y="146" class="s" text-anchor="middle">taste — per machine, never synced,</text>
  <text x="765" y="161" class="s" text-anchor="middle">no data-format bump (v6 stays v6)</text>

  <path class="hard" d="M135,96 C135,60 560,60 640,86" marker-end="url(#arr)"/>
  <text x="330" y="58" class="lbl">OK → save()  (Cancel writes nothing)</text>

  <!-- PlannerPage choke point -->
  <rect x="250" y="240" width="330" height="78" class="box" rx="10"/>
  <text x="415" y="264" class="b" text-anchor="middle">PlannerPage::applyDisplayPrefs()</text>
  <text x="415" y="282" class="s" text-anchor="middle">the ONE page-level QSettings reader —</text>
  <text x="415" y="297" class="s" text-anchor="middle">widgets are told; they never read prefs</text>

  <path class="hard" d="M375,168 V240" marker-end="url(#arr)"/>
  <text x="382" y="205" class="lbl">accept() → pull</text>
  <path class="soft" d="M640,178 C560,210 470,225 445,240" marker-end="url(#arrsoft)"/>
  <text x="520" y="212" class="lbl">read</text>

  <!-- hours group -->
  <rect x="20" y="360" width="440" height="150" class="group" rx="12"/>
  <text x="34" y="380" class="s">agenda hours — the display window</text>
  <rect x="40" y="392" width="190" height="100" class="box" rx="10"/>
  <text x="135" y="416" class="b" text-anchor="middle">AgendaWidget (day)</text>
  <text x="135" y="434" class="s" text-anchor="middle">setVisibleWindow —</text>
  <text x="135" y="449" class="s" text-anchor="middle">geometry via one slotTop;</text>
  <text x="135" y="464" class="s" text-anchor="middle">slot indices stay domain indices</text>

  <rect x="250" y="392" width="190" height="100" class="box" rx="10"/>
  <text x="345" y="416" class="b" text-anchor="middle">WeekAgendaView</text>
  <text x="345" y="434" class="s" text-anchor="middle">7-day UNION window →</text>
  <text x="345" y="449" class="s" text-anchor="middle">shared axis + all columns</text>
  <text x="345" y="464" class="s" text-anchor="middle">(alignment enforced here)</text>

  <path class="hard" d="M330,318 C260,340 180,365 145,392" marker-end="url(#arr)"/>
  <text x="150" y="352" class="lbl">setVisibleWindow</text>
  <path class="hard" d="M400,318 C390,345 365,368 350,392" marker-end="url(#arr)"/>
  <text x="365" y="352" class="lbl">window + firstDay</text>

  <!-- week group -->
  <rect x="480" y="360" width="480" height="150" class="group" rx="12"/>
  <text x="494" y="380" class="s">week start (Mon / Sun) — four screens, one formula: stats::weekStart</text>
  <rect x="500" y="392" width="140" height="100" class="box" rx="10"/>
  <text x="570" y="420" class="b" text-anchor="middle">WeekReviewPage</text>
  <text x="570" y="438" class="s" text-anchor="middle">summarizeWeek(…,</text>
  <text x="570" y="453" class="s" text-anchor="middle">firstDay) — a pure</text>
  <text x="570" y="468" class="s" text-anchor="middle">parameter, not a read</text>

  <rect x="656" y="392" width="140" height="100" class="box" rx="10"/>
  <text x="726" y="420" class="b" text-anchor="middle">MonthGrid</text>
  <text x="726" y="438" class="s" text-anchor="middle">column of the 1st +</text>
  <text x="726" y="453" class="s" text-anchor="middle">rotated day headers</text>

  <rect x="812" y="392" width="130" height="100" class="box" rx="10"/>
  <text x="877" y="420" class="b" text-anchor="middle">“Week of …”</text>
  <text x="877" y="438" class="s" text-anchor="middle">label — same snap,</text>
  <text x="877" y="453" class="s" text-anchor="middle">or it names a day</text>
  <text x="877" y="468" class="s" text-anchor="middle">the grid doesn't start</text>

  <path class="hard" d="M500,300 C540,330 560,360 568,392" marker-end="url(#arr)"/>
  <path class="hard" d="M580,290 C660,320 705,360 722,392" marker-end="url(#arr)"/>
  <path class="hard" d="M580,275 C760,300 850,355 872,392" marker-end="url(#arr)"/>
  <text x="620" y="332" class="lbl">setFirstDayOfWeek ×3</text>

  <!-- windowCovering pure fn -->
  <rect x="40" y="560" width="400" height="96" class="pure" rx="26"/>
  <text x="240" y="586" class="b" text-anchor="middle">AgendaWidget::windowCovering</text>
  <text x="240" y="605" class="t" text-anchor="middle">pure · static · shared — preference ∪ the date's events</text>
  <text x="240" y="623" class="b" text-anchor="middle" fill="#2F7E6E">= “data always wins”</text>
  <text x="240" y="641" class="s" text-anchor="middle">a narrowed view may hide empty hours, never a block</text>

  <path class="soft" d="M135,492 V560" marker-end="url(#arrsoft)"/>
  <text x="142" y="530" class="lbl">per-date range</text>
  <path class="soft" d="M345,492 C330,520 300,545 275,560" marker-end="url(#arrsoft)"/>
  <text x="330" y="530" class="lbl">×7 dates → union</text>

  <!-- CompareDialog -->
  <rect x="600" y="548" width="330" height="108" class="box" rx="10"/>
  <text x="765" y="574" class="b" text-anchor="middle">CompareDialog</text>
  <text x="765" y="592" class="s" text-anchor="middle">session glass: reads prefs itself;</text>
  <text x="765" y="607" class="s" text-anchor="middle">×2 datasets (mine, peer) → union window;</text>
  <text x="765" y="622" class="s" text-anchor="middle">identity headers pinned OUTSIDE the scroll —</text>
  <text x="765" y="637" class="s" text-anchor="middle">myName threaded MainWindow → SharingDialog → here</text>

  <path class="soft" d="M840,178 C930,260 930,440 900,548" marker-end="url(#arrsoft)"/>
  <text x="905" y="360" class="lbl">read</text>
  <path class="soft" d="M600,600 C520,600 480,620 440,616" marker-end="url(#arrsoft)"/>
  <text x="480" y="592" class="lbl">×2 datasets → union</text>
</svg>
