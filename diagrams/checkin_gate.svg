<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="721px" preserveAspectRatio="none" style="width:749px;height:721px;background:#FFFFFF;" version="1.1" viewBox="0 0 749 721" width="749px" zoomAndPan="magnify"><title>The check-in gate &#8212; once, in the morning, only when the day is heavy</title><defs/><g><text fill="#2A2E33" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="553.6904" x="96.5835" y="32.9951">The check-in gate &#8212; once, in the morning, only when the day is heavy</text><ellipse cx="235.376" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="371.4453" x="49.6533" y="87.2969"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="351.4453" x="59.6533" y="108.4355">a sweep asks checkin::shouldOffer(data, now, lastOffered)</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="225.1309" x="122.8105" y="189.668"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="192.9023" x="132.8105" y="210.8066">silence &#8212; a morning check-in at</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="205.1309" x="132.8105" y="224.7754">15:40 is a different, worse feature</text><ellipse cx="235.376" cy="270.1367" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="235.376" cy="270.1367" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#EDF4F1" points="167.5449,141.2656,303.207,141.2656,315.207,153.2656,303.207,165.2656,167.5449,165.2656,155.5449,153.2656,167.5449,141.2656" style="stroke:#2F7E6E;stroke-width:0.5;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="239.376" y="175.4761">no</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="135.6621" x="167.5449" y="157.4199">06:00 &#8804; now &lt; 11:00?</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="315.207" y="150.6714">yes</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="213.3008" x="128.7256" y="375.4766"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="171.0996" x="138.7256" y="396.6152">silence &#8212; once means once,</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="193.3008" x="138.7256" y="410.584">asking twice is nagging squared</text><ellipse cx="235.376" cy="454.9609" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="235.376" cy="454.9609" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#EDF4F1" points="167.2256,323.1367,303.5264,323.1367,315.5264,337.1055,303.5264,351.0742,167.2256,351.0742,155.2256,337.1055,167.2256,323.1367" style="stroke:#2F7E6E;stroke-width:0.5;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="239.376" y="361.2847">yes</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="136.3008" x="167.2256" y="334.2754">already offered today?</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="128.7129" x="167.2256" y="348.2441">lastOffered == today</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="315.5264" y="334.5112">no</text><polygon fill="#EDF4F1" points="153.7578,507.9609,316.9941,507.9609,328.9941,528.9141,316.9941,549.8672,153.7578,549.8672,141.7578,528.9141,153.7578,507.9609" style="stroke:#2F7E6E;stroke-width:0.5;"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="77.6133" x="153.7578" y="519.0996">isDayHeavy?</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="103.0371" x="153.7578" y="533.0684">&#8805;5h planned  OR</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="163.2363" x="153.7578" y="547.0371">&#8805;2 tasks due within 2 days</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="128.0562" y="526.3198">no</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="328.9941" y="526.3198">yes</text><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="210.1953" x="11" y="559.8672"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="190.1953" x="21" y="581.0059">silence &#8212; a quiet Tuesday does</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="179.2031" x="21" y="594.9746">not need a wellness interview</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="97.8574" x="21" y="608.9434">(&#167;G.1, verbatim)</text><ellipse cx="116.0977" cy="667.7734" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="116.0977" cy="667.7734" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><path d="M488.1133,559.8672 L488.1133,602.7734 L468.1133,606.7734 L488.1133,610.7734 L488.1133,653.6797 A0,0 0 0 0 488.1133,653.6797 L737.8574,653.6797 A0,0 0 0 0 737.8574,653.6797 L737.8574,569.8672 L727.8574,559.8672 L488.1133,559.8672 A0,0 0 0 0 488.1133,559.8672 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><path d="M727.8574,559.8672 L727.8574,569.8672 L737.8574,569.8672 L727.8574,559.8672 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="199.3535" x="494.1133" y="576.0059">Mood, once answered, is the first</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="205.4707" x="494.1133" y="589.9746">stored fact the app cannot derive:</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="212.8477" x="494.1133" y="603.9434">data.json, format v12, one per day,</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="228.7441" x="494.1133" y="617.9121">trimmed at 14 by the midnight knock.</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="216.6094" x="494.1133" y="631.8809">The NOTE never enters a briefing &#8212;</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="197.0098" x="494.1133" y="645.8496">pinned by test, not by comment.</text><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="226.918" x="241.1953" y="575.8203"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="193.4531" x="251.1953" y="596.959">OFFER &#8212; part 2 turns this into a</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="206.918" x="251.1953" y="610.9277">toast whose action opens the chat</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="150.7617" x="251.1953" y="624.8965">with the check-in waiting</text><ellipse cx="354.6543" cy="699.6797" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="354.6543" cy="699.6797" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="235.376" x2="235.376" y1="67.2969" y2="87.2969"/><polygon fill="#616974" points="231.376,77.2969,235.376,87.2969,239.376,77.2969,235.376,81.2969" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="235.376" x2="235.376" y1="237.6055" y2="259.1367"/><polygon fill="#616974" points="231.376,249.1367,235.376,259.1367,239.376,249.1367,235.376,253.1367" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="235.376" x2="235.376" y1="165.2656" y2="189.668"/><polygon fill="#616974" points="231.376,179.668,235.376,189.668,239.376,179.668,235.376,183.668" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="315.207" x2="357.9414" y1="153.2656" y2="153.2656"/><polygon fill="#616974" points="353.9414,229.1367,357.9414,239.1367,361.9414,229.1367,357.9414,233.1367" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="357.9414" x2="357.9414" y1="153.2656" y2="303.1367"/><line style="stroke:#616974;stroke-width:1.0;" x1="357.9414" x2="235.376" y1="303.1367" y2="303.1367"/><line style="stroke:#616974;stroke-width:1.0;" x1="235.376" x2="235.376" y1="303.1367" y2="323.1367"/><polygon fill="#616974" points="231.376,313.1367,235.376,323.1367,239.376,313.1367,235.376,317.1367" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="235.376" x2="235.376" y1="121.2656" y2="141.2656"/><polygon fill="#616974" points="231.376,131.2656,235.376,141.2656,239.376,131.2656,235.376,135.2656" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="235.376" x2="235.376" y1="423.4141" y2="443.9609"/><polygon fill="#616974" points="231.376,433.9609,235.376,443.9609,239.376,433.9609,235.376,437.9609" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="235.376" x2="235.376" y1="351.0742" y2="375.476