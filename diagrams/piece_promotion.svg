@startuml piece_promotion

skinparam backgroundColor            #FFFFFF
skinparam defaultFontName            "Segoe UI"
skinparam defaultFontSize            12
skinparam defaultFontColor           #2A2E33
skinparam shadowing                  false
skinparam roundCorner                8

skinparam ArrowColor                 #616974
skinparam ArrowFontColor             #616974
skinparam ArrowFontSize              11

skinparam rectangle {
  BackgroundColor                    #FFFFFF
  BorderColor                        #616974
  FontColor                          #2A2E33
}
skinparam database {
  BackgroundColor                    #EDF4F1
  BorderColor                        #2F7E6E
}
skinparam component {
  BackgroundColor                    #FFFFFF
  BorderColor                        #616974
}
skinparam note {
  BackgroundColor                    #FDF6EC
  BorderColor                        #C9A45C
  FontColor                          #5A4A2A
}
skinparam class {
  BackgroundColor                    #FFFFFF
  BorderColor                        #616974
  HeaderBackgroundColor              #EDF4F1
}
skinparam sequence {
  ParticipantBackgroundColor         #FFFFFF
  ParticipantBorderColor             #616974
  LifeLineBorderColor                #A9B0B8
  GroupBackgroundColor               #EDF4F1
}
skinparam state {
  BackgroundColor                    #FFFFFF
  BorderColor                        #616974
}
skinparam activity {
  BackgroundColor                    #FFFFFF
  BorderColor                        #616974
  DiamondBackgroundColor             #EDF4F1
  DiamondBorderColor                 #2F7E6E
}
skinparam title {
  FontSize                           14
  FontColor                          #2A2E33
}


start
:a piece, with an estimate;
if (has its own due date?) then (yes — PROMOTED)
  :answers for ITSELF:
  own verdict, own nudge,
  own needs-a-block line;
  :its minutes LEAVE the parent
  (subtracted from a sized parent,
  skipped by an unsized one's borrow);
else (no)
  :no verdict of its own
  (affordability needs a date);
  :weighs on the parent
  (inside its estimate, or
  borrowed when unsized);
endif
:believed total = entered total, once;
note right
  Floor at zero: pieces promoted
  past the parent's estimate cede
  ALL of it — the parent falls back
  to the planned-blocks proxy,
  never goes negative.
end note
stop
@enduml

