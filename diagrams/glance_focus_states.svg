fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="164.0977" x="560.45" y="648.373">panel is what it always was</text></g><g id="clear"><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="207.4648" x="523.95" y="461.2969"/><line style="stroke:#616974;stroke-width:0.5;" x1="523.95" x2="731.4148" y1="513.2031" y2="513.2031"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="39.1934" x="608.0857" y="477.4355">CLEAR</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="187.4648" x="533.95" y="491.4043">&#171;Everything's on the calendar&#187;</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="99.9023" x="577.7313" y="505.373">put-off strip only</text></g><g id="focus"><rect fill="#FFFFFF" height="75.875" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="251.1699" x="126.95" y="289.2969"/><line style="stroke:#616974;stroke-width:0.5;" x1="126.95" x2="378.1199" y1="355.1719" y2="355.1719"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="41.127" x="231.9715" y="305.4355">FOCUS</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="231.1699" x="136.95" y="319.4043">GATE &#8212; card takes the panel's stretch</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="137.7832" x="183.6434" y="333.373">ONE task, hero density</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="166.043" x="169.5135" y="347.3418">&#171;1 of N&#187; expands to the list</text></g><g id="strip"><rect fill="#FFFFFF" height="75.875" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="213.6406" x="207.45" y="454.2969"/><line style="stroke:#616974;stroke-width:0.5;" x1="207.45" x2="421.0906" y1="520.1719" y2="520.1719"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="34.0605" x="297.24" y="470.4355">STRIP</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="193.6406" x="217.45" y="484.4043">reviewed &#8212; day content returns</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="144.7148" x="241.9129" y="498.373">pinned rows stay visible</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="143.5605" x="242.49" y="512.3418">card sizes to its content</text></g><ellipse cx="627.45" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN17"><path d="M412.95,291.2969 L412.95,323.2969 L378.05,327.2969 L412.95,331.2969 L412.95,363.1406 A4,4 0 0 0 416.95,367.1406 L678.3055,367.1406 A4,4 0 0 0 682.3055,363.1406 L682.3055,297.2969 L672.3055,287.2969 L416.95,287.2969 A4,4 0 0 0 412.95,291.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><path d="M672.3055,287.2969 L672.3055,295.2969 A2,2 0 0 0 674.3055,297.2969 L682.3055,297.2969 L672.3055,287.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="77.7598" x="418.95" y="303.4355">The gate is a</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="92.8359" x="500.5242" y="303.4355">stretch factor</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="38.4492" x="593.3602" y="303.4355">, not a</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="248.3555" x="418.95" y="317.4043">fixed height: the card CLAIMS the panel's</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="212.1211" x="418.95" y="331.373">space rather than asking for it. See</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="232.9512" x="418.95" y="345.3418">needsblock_height_bound for why that</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="204.2461" x="418.95" y="359.3105">distinction cost a release to learn.</text></g><!--link *start* to derive--><g id="link_*start*_derive"><path d="M627.45,63.4169 C627.45,76.7569 627.45,96.3669 627.45,118.0469 " fill="none" id="*start*-to-derive" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="627.45,124.0469,631.45,115.0469,627.45,119.0469,623.45,115.0469,627.45,124.0469" style="stroke:#616974;stroke-width:1.0;"/></g><!--link derive to hidden--><g id="link_derive_hidden"><path d="M714.05,200.3469 C749.76,220.4769 787.42,249.1669 807.45,287.2969 C859.14,385.6769 808.53,436.7969 748.45,530.2969 C730.26,558.6069 707.6211,581.1669 685.3311,600.3169 " fill="none" id="derive-to-hidden" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="680.78,604.2269,690.2132,601.396,684.5726,600.9686,685,595.3279,680.78,604.2269" style="stroke:#616974;stroke-width:1.0;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="54.9409" x="842.6634" y="408.5073">list empty</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="91.3677" x="824.45" y="421.312">and none put off</text></g><!--link derive to clear--><g id="link_derive_clear"><path d="M655.93,200.3269 C672.17,223.8369 690.94,255.6869 699.45,287.2969 C708.69,321.6269 708.69,332.9669 699.45,367.2969 C690.06,402.1469 671.7092,432.4329 654.5292,456.3629 " fill="none" id="derive-to-clear" style="stroke:#616974;stroke-width:1.0;"/><polygon fill="#616974" points="651.03,461.2369,659.5281,456.2587,653.946,457.1752,653.0294,451.5931,651.03,461.2369" style="stroke