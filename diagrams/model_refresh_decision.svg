<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="456px" preserveAspectRatio="none" style="width:1454px;height:456px;background:#FFFFFF;" version="1.1" viewBox="0 0 1454 456" width="1454px" zoomAndPan="magnify"><title>TaskListModel::refresh() &#8212; spend a diff to save the user's scroll position</title><defs/><g><text fill="#2A2E33" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="574.2461" x="438.8115" y="32.9951">TaskListModel::refresh() &#8212; spend a diff to save the user's scroll position</text><ellipse cx="490.0786" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="171.2656" x="404.4458" y="87.2969"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="151.2656" x="414.4458" y="108.4355">AppData::changed() fires</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="171.0488" x="404.5542" y="141.2656"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="134.1328" x="414.5542" y="162.4043">take a fresh snapshot,</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="151.0488" x="414.5542" y="176.373">diff it against the old one</text><polygon fill="#EDF4F1" points="421.8813,209.2031,558.2759,209.2031,570.2759,221.2031,558.2759,233.2031,421.8813,233.2031,409.8813,221.2031,421.8813,209.2031" style="stroke:#2F7E6E;stroke-width:0.5;"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="136.3945" x="421.8813" y="225.3574">same ids, same order?</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="390.873" y="218.6089">yes</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="570.2759" y="218.6089">no</text><path d="M233.959,243.2031 L233.959,265.1563 L213.959,269.1563 L233.959,273.1563 L233.959,295.1094 A0,0 0 0 0 233.959,295.1094 L499.1777,295.1094 A0,0 0 0 0 499.1777,295.1094 L499.1777,253.2031 L489.1777,243.2031 L233.959,243.2031 A0,0 0 0 0 233.959,243.2031 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><path d="M489.1777,243.2031 L489.1777,253.2031 L499.1777,253.2031 L489.1777,243.2031 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="236.9355" x="239.959" y="259.3418">A description-only edit emits NOTHING:</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="222.2285" x="239.959" y="273.3105">the description is not a role this view</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="244.2188" x="239.959" y="287.2793">paints. Scroll and selection both survive.</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="202.959" x="11" y="245.1875"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="89.8301" x="21" y="266.3262">dataChanged</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="89.3145" x="114.6445" y="266.3262">on rows whose</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="65.1621" x="21" y="280.2949">visible role</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="92.332" x="89.9766" y="280.2949">actually moved</text><polygon fill="#EDF4F1" points="802.5361,243.2031,932.8193,243.2031,944.8193,257.1719,932.8193,271.1406,802.5361,271.1406,790.5361,257.1719,802.5361,243.2031" style="stroke:#2F7E6E;stroke-width:0.5;"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="130.2832" x="802.5361" y="254.3418">do the survivors keep</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="119.6953" x="802.5361" y="268.3105">their relative order?</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="771.5278" y="254.5776">yes</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="203.8276" x="944.8193" y="254.5776">no &#8212; a due-date edit re-sorted a row</text><path d="M785.4004,293.125 L785.4004,308.0938 L765.4004,312.0938 L785.4004,316.0938 L785.4004,331.0625 A0,0 0 0 0 785.4004,331.0625 L999.3672,331.0625 A0,0 0 0 0 999.3672,331.0625 L999.3672,303.125 L989.3672,293.125 L785.4004,293.125 A0,0 0 0 0 785.4004,293.125 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><path d="M989.3672,293.125 L989.3672,303.125 L999.3672,303.125 L989.3672,293.125 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="192.9668" x="791.4004" y="309.2637">Scroll mostly survives; selection</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="178.8105" x="791.4004" y="323.2324">follows the rows Qt can track.</text><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="236.2227" x="529.1777" y="281.1406"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="127.7754" x="539.1777" y="302.2793">beginRemoveRows</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="84.6328" x="670.7676" y="302.2793">(vanished ids)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="10.0547" x="539.1777" y="316.248">+</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="113.6309" x="553.0469" y="316.248">beginInsertRows</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="55.1836" x="670.4922" y="316.248">(new ids)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="204.3457" x="539.1777" y="330.2168">+ dataChanged (edited survivors)</text><path d="M1176.7656,281.1406 L1176.7656,303.0938 L1156.7656,307.0938 L1176.7656,311.0938 L1176.7656,333.0469 A0,0 0 0 0 1176.7656,333.0469 L1442.8691,333.0469 A0,0 0 0 0 1442.8691,333.0469 L1442.8691,291.1406 L1432.8691,281.1406 L1176.7656,281.1406 A0,0 0 0 0 1176.7656,281.1406 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><path d="M1432.8691,281.1406 L1432.8691,291.1406 L1442.8691,291.1406 L1432.8691,281.1406 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="240.5801" x="1182.7656" y="297.2793">The honest fallback: assume everything</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="245.1035" x="1182.7656" y="311.248">moved. Cheap to write, expensive to the</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="224.4141" x="1182.7656" y="325.2168">user &#8212; which is exactly why it is last.</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="137.3984" x="1019.3672" y="290.1094"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="117.3984" x="1029.3672" y="311.248">beginResetModel</text><polygon fill="#EDF4F1" points="867.6777,349.0469,879.6777,361.0469,867.6777,373.0469,855.6777,361.046