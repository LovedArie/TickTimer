dth:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="1088.0664" x2="1088.0664" y1="324.0781" y2="361.0469"/><line style="stroke:#616974;stroke-width:1.0;" x1="1088.0664" x2="879.6777" y1="361.0469" y2="361.0469"/><polygon fill="#616974" points="889.6777,357.0469,879.6777,361.0469,889.6777,365.0469,885.6777,361.0469" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="409.8813" x2="112.4795" y1="221.2031" y2="221.2031"/><line style="stroke:#616974;stroke-width:1.0;" x1="112.4795" x2="112.4795" y1="221.2031" y2="245.1875"/><polygon fill="#616974" points="108.4795,235.1875,112.4795,245.1875,116.4795,235.1875,112.4795,239.1875" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="570.2759" x2="867.6777" y1="221.2031" y2="221.2031"/><line style="stroke:#616974;stroke-width:1.0;" x1="867.6777" x2="867.6777" y1="221.2031" y2="243.2031"/><polygon fill="#616974" points="863.6777,233.2031,867.6777,243.2031,871.6777,233.2031,867.6777,237.2031" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="112.4795" x2="112.4795" y1="293.125" y2="391.0469"/><line style="stroke:#616974;stroke-width:1.0;" x1="112.4795" x2="478.0786" y1="391.0469" y2="391.0469"/><polygon fill="#616974" points="468.0786,387.0469,478.0786,391.0469,468.0786,395.0469,472.0786,391.0469" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="867.6777" x2="867.6777" y1="373.0469" y2="391.0469"/><line style="stroke:#616974;stroke-width:1.0;" x1="867.6777" x2="502.0786" y1="391.0469" y2="391.0469"/><polygon fill="#616974" points="512.0786,387.0469,502.0786,391.0469,512.0786,395.0469,508.0786,391.0469" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="490.0786" x2="490.0786" y1="189.2031" y2="209.2031"/><polygon fill="#616974" points="486.0786,199.2031,490.0786,209.2031,494.0786,199.2031,490.0786,203.2031" sty