<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1185px" preserveAspectRatio="none" style="width:617px;height:1185px;background:#FFFFFF;" version="1.1" viewBox="0 0 617 1185" width="617px" zoomAndPan="magnify"><title>The window's memory &#8212; restore (four ways in, one way out) and save</title><defs/><g><text fill="#2A2E33" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="554.1553" x="30.1157" y="32.9951">The window's memory &#8212; restore (four ways in, one way out) and save</text><ellipse cx="268.958" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="201.3301" x="168.293" y="87.2969"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="181.3301" x="178.293" y="108.4355">MainWindow constructor ends</text><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="281.1055" x="128.4053" y="141.2656"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="261.1055" x="138.4053" y="162.4043">resize(kDefaultWidth, kDefaultHeight)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="180.4629" x="138.4053" y="176.373">set FIRST, so every exit below</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="200.3555" x="138.4053" y="190.3418">already stands on a sane window</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="151.6367" x="193.1396" y="223.1719"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="131.6367" x="203.1396" y="244.3105">restoreWindowState()</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="283.0859" x="127.415" y="277.1406"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="163.0195" x="137.415" y="298.2793">RAIL &#8212; m_nav-&gt;setVisible(</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="255.457" x="145.0439" y="312.248">prefs::sidebarVisible(!isCompactScreen()))</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="239.8086" x="149.0537" y="393.4805"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="38.4023" x="159.0537" y="414.6191">DONE</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="173.6543" x="201.2705" y="414.6191">&#8212; geometry is neither saved</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="219.8086" x="159.0537" y="428.5879">nor restored on phone-sized screens</text><ellipse cx="268.958" cy="473.9492" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="268.958" cy="473.9492" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#EDF4F1" points="208.6973,345.0781,329.2188,345.0781,341.2188,357.0781,329.2188,369.0781,208.6973,369.0781,196.6973,357.0781,208.6973,345.0781" style="stroke:#2F7E6E;stroke-width:0.5;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="272.958" y="379.2886">yes</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="120.5215" x="208.6973" y="361.2324">isCompactScreen()?</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="341.2188" y="354.4839">no</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="180.9805" x="178.4678" y="575.3516"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="38.4023" x="188.4678" y="596.4902">DONE</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="118.7637" x="230.6846" y="596.4902">&#8212; default rectangle</text><ellipse cx="268.958" cy="648.8359" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="268.958" cy="648.8359" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#EDF4F1" points="168.0068,526.9492,369.9092,526.9492,381.9092,538.9492,369.9092,550.9492,168.0068,550.9492,156.0068,538.9492,168.0068,526.9492" style="stroke:#2F7E6E;stroke-width:0.5;"/><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="108.9849" x="272.958" y="561.1597">yes &#8212; first run here</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="201.9023" x="168.0068" y="543.1035">prefs::windowGeometry() empty?</text><text fill="#616974" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="381.9092" y="536.355">no</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="180.9805" x="178.4678" y="756.6406"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="38.4023" x="188.4678" y="777.7793">DONE</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="118.7637" x="230.6846" y="777.7793">&#8212; default rectangle</text><ellipse cx="268.958" cy="830.125" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="268.958" cy="830.125" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#EDF4F1" points="199.9375,701.8359,337.9785,7