tLength="180.668" x="63.2168" y="942.2012">&#8212; window is where you left it,</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="144.2402" x="21" y="956.1699">maximized state and all</text><ellipse cx="132.4424" cy="1013.9688" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="132.4424" cy="1013.9688" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="248.6914" x="281.1279" y="921.0625"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="202.7051" x="291.1279" y="942.2012">setWindowState(WindowNoState)</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="228.6914" x="291.1279" y="956.1699">&#8212; drop a maximize aimed at a screen</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="124.002" x="291.1279" y="970.1387">that no longer exists</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="181.4141" x="314.7666" y="1016.9375"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="161.4141" x="324.7666" y="1038.0762">resize + centre on primary</text><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#616974;stroke-width:0.5;" width="231.4531" x="289.7471" y="1070.9063"/><text fill="#2A2E33" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="38.4023" x="299.7471" y="1092.0449">DONE</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="122.5781" x="341.9639" y="1092.0449">&#8212; default rectangle.</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="211.4531" x="299.7471" y="1106.0137">Silent: an unreadable preference is</text><text fill="#2A2E33" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="191.8652" x="299.7471" y="1119.9824">not an error the user can act on</text><ellipse cx="405.4736" cy="1163.8125" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="405.4736" cy="1163.8125" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="268.958" x2="268.958" y1="67.2969" y2="87.2969"/><polygon fill="#616974" points="264.958,77.2969,268.958,87.2969,272.958,77.2969,268.958,81.2969" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="268.958" x2="268.958" y1="121.2656" y2="141.2656"/><polygon fill="#616974" points="264.958,131.2656,268.958,141.2656,272.958,131.2656,268.958,135.2656" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="268.958" x2="268.958" y1="203.1719" y2="223.1719"/><polygon fill="#616974" points="264.958,213.1719,268.958,223.1719,272.958,213.1719,268.958,217.1719" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="268.958" x2="268.958" y1="257.1406" y2="277.1406"/><polygon fill="#616974" points="264.958,267.1406,268.958,277.1406,272.958,267.1406,268.958,271.1406" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="268.958" x2="268.958" y1="441.418" y2="462.9492"/><polygon fill="#616974" points="264.958,452.9492,268.958,462.9492,272.958,452.9492,268.958,456.9492" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="268.958" x2="268.958" y1="369.0781" y2="393.4805"/><polygon fill="#616974" points="264.958,383.4805,268.958,393.4805,272.958,383.4805,268.958,387.4805" style="stroke:#616974;stroke-width:1.0;"/><line style="stroke:#616974;stroke-width:1.0;" x1="341.2188" x2="398.8623" y1="357.0781" y2="357.0781"/><polygon fill=