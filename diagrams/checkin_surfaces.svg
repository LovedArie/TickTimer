 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:1.0;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="250.3125" x="257.5869" y="524.4355">&#167;E.4 in part 2, satisfied by SUBTRACTION:</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="240.9785" x="257.5869" y="538.4043">no model is in the check-in loop at all &#8212;</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="275.6426" x="257.5869" y="552.373">opener and acknowledgement are C++ citing</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="233.3613" x="257.5869" y="566.3418">evidence (&#167;G.3). The model joins when</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="144.3047" x="257.5869" y="580.3105">per-role primaries exist.</text></g><g id="elem_GMN18"><path d="M429.5869,210.2969 L429.5869,268.1719 A4,4 0 0 0 433.5869,272.1719 L690.3545,272.1719 A4,4 0 0 0 694.3545,268.1719 L694.3545,216.2969 L684.3545,206.2969 L549.0769,206.2969 L497.7169,116.5269 L541.0769,206.2969 L433.5869,206.2969 A4,4 0 0 0 429.5869,210.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><path d="M684.3545,206.2969 L684.3545,214.2969 A2,2 0 0 0 686.3545,216.2969 L694.3545,216.2969 L684.3545,206.2969 " fill="#FDF6EC" style="stroke:#C9A45C;stroke-width:0.5;"/><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="238.4824" x="435.5869" y="222.4355">Marked at EMIT, not at tap: a dismissed</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="220.6465" x="435.5869" y="236.4043">toast was still an ask. Marking at tap</text><text fill="#5A4A2A" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="243.7676" x="435.5869" y="250.373">would re-knock at someone who already</text><text fil